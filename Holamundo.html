<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Animado</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050510;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="worldCanvas"></canvas>

  <script>
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Configuración del mundo
    const world = {
      x: width / 2,
      y: height / 2,
      radius: 120,
      angle: 0
    };

    // Crear atmósfera / partículas
    const numParticles = 60;
    const particles = [];

    for (let i = 0; i < numParticles; i++) {
      particles.push({
        orbitRadius: world.radius + 20 + Math.random() * 80,
        angle: Math.random() * Math.PI * 2,
        speed: 0.005 + Math.random() * 0.015,
        size: 2 + Math.random() * 3
      });
    }

    function animate() {
      // Limpiar pantalla
      ctx.clearRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;

      // 1. Dibujar el Planeta (Base)
      const gradient = ctx.createRadialGradient(
        centerX - 30, centerY - 30, 10,
        centerX, centerY, world.radius
      );
      gradient.addColorStop(0, '#4facfe');
      gradient.addColorStop(1, '#00f2fe');

      ctx.beginPath();
      ctx.arc(centerX, centerY, world.radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.shadowBlur = 30;
      ctx.shadowColor = '#00f2fe';
      ctx.fill();
      ctx.shadowBlur = 0; // Reiniciar sombra

      // 2. Dibujar Continentes / Detalles en rotación
      world.angle += 0.01;
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, world.radius, 0, Math.PI * 2);
      ctx.clip(); // Recortar para que no salga del planeta

      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      for (let i = -2; i < 3; i++) {
        const offsetX = ((world.angle * 50 + i * 120) % (world.radius * 4)) - world.radius * 2;
        ctx.beginPath();
        ctx.ellipse(centerX + offsetX, centerY + (i * 30), 40, 20, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 3. Dibujar Partículas en Órbita
      particles.forEach(p => {
        p.angle += p.speed;
        const px = centerX + Math.cos(p.angle) * p.orbitRadius;
        const py = centerY + Math.sin(p.angle) * (p.orbitRadius * 0.4); // Perspectiva inclinada

        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
